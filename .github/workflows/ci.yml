name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Find cases
        id: cases
        run: |
          matrix="$(python3 tools/ci-cases)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and cache shared image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: excel-vba-casebook:latest
          push: false
          cache-from: type=gha,scope=excel-vba-casebook
          cache-to: type=gha,scope=excel-vba-casebook,mode=max

  case:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Check ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: default-load=true
      - name: Load shared image and warm local build cache
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: excel-vba-casebook:latest
          load: true
          push: false
          cache-from: type=gha,scope=excel-vba-casebook
      - name: Run case
        working-directory: ${{ matrix.case }}
        run: ./run.sh
      - name: Run tests against regenerated files
        env:
          CASE_FOLDER: ${{ matrix.case }}
        run: |
          case_root="$GITHUB_WORKSPACE/$CASE_FOLDER"
          test_root="$case_root"
          extra_mounts=()
          if [[ "$CASE_FOLDER" == combine-many-files ]]; then
            run_dirs=("$case_root"/runs/run.*)
            [[ ${#run_dirs[@]} == 1 && -d "${run_dirs[0]}" ]]
            test_root="${run_dirs[0]}"
            extra_mounts=(--mount "type=bind,source=$case_root/input/files,target=/source,readonly")
          fi
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            "${extra_mounts[@]}" \
            --mount "type=bind,source=$test_root,target=/case" \
            --workdir /case excel-vba-casebook \
            python3 -m pytest -q -p no:cacheprovider tests
